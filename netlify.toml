# Netlify build + redirect config for coach-nikki-site

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS is a static SPA under /admin/ — make sure /admin resolves to it
[[redirects]]
  from = "/admin"
  to   = "/admin/index.html"
  status = 200

# Campaign landing page: canonical slug is /AF (uppercase). Catch lowercase
# /af and /af-thanks so a typed or mis-cased URL still lands correctly.
[[redirects]]
  from = "/af"
  to   = "/AF"
  status = 301
[[redirects]]
  from = "/af-thanks"
  to   = "/AF-thanks"
  status = 301

# Long-cache hashed assets emitted by Astro
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Tighten common security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    Permissions-Policy    = "geolocation=(), camera=(), microphone=()"
