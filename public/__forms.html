<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Form bootstrap — Netlify detection</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <!--
    Belt-and-braces: a plain-HTML version of each form Netlify needs to detect at
    build time. Netlify scans static .html output for [data-netlify] forms; the
    real form lives on /contact and may differ in attributes. Keep field names
    identical between this file and the real form.
  -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="radio" name="channel" value="email" />
    <input type="radio" name="channel" value="phone" />
    <input type="radio" name="channel" value="sms" />
    <input type="radio" name="channel" value="instagram" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>
</body>
</html>
