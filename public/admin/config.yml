# Decap CMS config — mirrors src/content.config.ts
# If you change a field here, change the matching Zod schema too.
backend:
  name: git-gateway
  branch: main

# Editorial workflow is OFF — save means publish, no review queue.
#publish_mode: editorial_workflow

# Uploaded images land in /public/uploads and are served from the site root.
media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://www.coachnikki.com.au
display_url: https://www.coachnikki.com.au
logo_url: https://www.coachnikki.com.au/favicon.svg

collections:

  # ===========================================================================
  # PAGES — one entry per page on the site. Each entry has hero fields plus the
  # specific blocks that page renders, in document (top-to-bottom) order.
  # Files collection means each page has its OWN custom schema.
  # ===========================================================================
  - name: "pages"
    label: "Page copy"
    label_singular: "Page"
    delete: false

    files:

      # ─── 01 Home ────────────────────────────────────────────────────────
      - name: "home"
        label: "01 Home"
        file: "src/content/pages/home.md"
        fields:
          - { name: title, label: "Page title (internal)", widget: string, default: "01 Home" }

          # Hero
          - { name: eyebrow, label: "HERO · Eyebrow", widget: string, required: false }
          - { name: heroHeadline, label: "HERO · Headline", widget: string, required: false }
          - { name: heroSubcopy, label: "HERO · Subcopy", widget: text, required: false }
          - { name: heroImage, label: "HERO · Image", widget: image, required: false }
          - { name: primaryCtaLabel, label: "HERO · Primary CTA label", widget: string, required: false }
          - { name: primaryCtaHref, label: "HERO · Primary CTA link", widget: string, required: false }
          - { name: secondaryCtaLabel, label: "HERO · Secondary CTA label", widget: string, required: false }
          - { name: secondaryCtaHref, label: "HERO · Secondary CTA link", widget: string, required: false }

          # Three doors
          - name: doors
            label: "DOORS · Three feature cards"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string, required: false }
              - { name: heading, label: "Heading", widget: string, required: false }
              - { name: lead, label: "Lead paragraph", widget: text, required: false }
              - name: items
                label: "Door cards"
                widget: list
                fields:
                  - { name: tag, label: "Chip label", widget: string }
                  - name: tagStyle
                    label: "Chip colour"
                    widget: select
                    options: ["teal", "pink", "orange"]
                    default: "teal"
                  - { name: heading, label: "Card heading", widget: string }
                  - { name: body, label: "Card body", widget: text }
                  - { name: href, label: "Link", widget: string }
                  - { name: imageHint, label: "Photo caption (placeholder)", widget: string, required: false }
                  - { name: arrowLabel, label: "Arrow label", widget: string, default: "Learn more →" }

          # Promise / Safe Seen Heard
          - name: promise
            label: "PROMISE · Safe / Seen / Heard"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string, required: false }
              - { name: heading, label: "Heading", widget: string, required: false }
              - name: tiles
                label: "Tiles"
                widget: list
                required: false
                fields:
                  - { name: word, label: "Word", widget: string }
                  - { name: body, label: "Body", widget: text }
              - { name: pullQuote, label: "Pull quote", widget: text, required: false }
              - { name: pullQuoteCite, label: "Pull quote citation", widget: string, required: false }

          # Three-sessions arc
          - name: arc
            label: "ARC · Three sessions explainer"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string, required: false }
              - { name: heading, label: "Heading", widget: string, required: false }
              - { name: lead, label: "Lead", widget: text, required: false }
              - name: steps
                label: "Steps"
                widget: list
                fields:
                  - { name: title, label: "Step title", widget: string }
                  - { name: body, label: "Step body", widget: text }
              - { name: introCtaHeadline, label: "Intro CTA headline", widget: string, required: false }
              - { name: introCtaSubcopy, label: "Intro CTA subcopy", widget: text, required: false }
              - { name: introCtaLabel, label: "Intro CTA button label", widget: string, required: false }
              - { name: introCtaHref, label: "Intro CTA button link", widget: string, required: false }

          # Section headers
          - name: sessionsSectionHeader
            label: "SECTION · Sessions list header"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string, required: false }
              - { name: heading, label: "Heading", widget: string, required: false }
              - { name: caption, label: "Caption below the cards", widget: text, required: false }

          - name: testimonialsHeader
            label: "SECTION · Testimonials header"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string, required: false }
              - { name: heading, label: "Heading", widget: string, required: false }

          - name: blogHeader
            label: "SECTION · Blog header"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: eyebrow, label: "Eyebrow", widget: string, required: false }
              - { name: heading, label: "Heading", widget: string, required: false }

          # SEO
          - { name: seoTitle, label: "SEO · Browser tab title", widget: string, required: false }
          - { name: seoDescription, label: "SEO · Description", widget: text, required: false }

