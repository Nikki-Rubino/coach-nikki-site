# Decap CMS config — mirrors src/content.config.ts
# If you change a field here, change the matching Zod schema too.
backend:
  name: git-gateway
  branch: main
  # When deploying, enable Netlify Identity on the site and turn on Git Gateway.
  # If we move off Identity later (it's in maintenance), swap to:
  #   name: github
  #   repo: <nikki-account>/coach-nikki-site
  #   branch: main

# Editorial workflow is OFF — Nikki prefers save-and-publish without review queue
# and the email noise that comes with it. Leaving the line commented as a flag in
# case we want to switch it back on later.
#publish_mode: editorial_workflow

# Uploaded images land in /public/uploads and are served from the site root.
media_folder: "public/uploads"
public_folder: "/uploads"

# Friendly site name shown in the CMS header
site_url: https://www.coachnikki.com.au
display_url: https://www.coachnikki.com.au
logo_url: https://www.coachnikki.com.au/favicon.svg

collections:

  # ---------------------------------------------------------------
  # PAGES — editable hero copy for top-level pages (one entry per page)
  # ---------------------------------------------------------------
  - name: "pages"
    label: "Page copy"
    label_singular: "Page"
    folder: "src/content/pages"
    create: false           # pages are fixed; only edit existing
    delete: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}}"
    # Pages are ordered by the numeric prefix in the title field (01, 02, …) so
    # they appear in website-navigation order in the CMS sidebar. Sort by title
    # ascending is the default with these prefixes.
    sortable_fields: ["title"]
    view_filters:
      - label: "Live pages"
        field: "title"
        pattern: "^0[1-9] |^1[0-2] |^15 "
      - label: "Thanks pages (hidden)"
        field: "title"
        pattern: "^1[34] "
    fields:
      - { name: title, label: "Page title (internal)", widget: string }
      - { name: eyebrow, label: "Eyebrow line", widget: string, required: false }
      - { name: heroHeadline, label: "Hero headline", widget: string, required: false }
      - { name: heroSubcopy, label: "Hero subcopy", widget: text, required: false }
      - { name: heroImage, label: "Hero image", widget: image, required: false }
      - { name: primaryCtaLabel, label: "Primary CTA label", widget: string, required: false }
      - { name: primaryCtaHref, label: "Primary CTA link", widget: string, required: false }
      - { name: secondaryCtaLabel, label: "Secondary CTA label", widget: string, required: false }
      - { name: secondaryCtaHref, label: "Secondary CTA link", widget: string, required: false }
      - { name: seoTitle, label: "SEO title (browser tab)", widget: string, required: false }
      - { name: seoDescription, label: "SEO description", widget: text, required: false }
      - { name: acuityEmbedUrl, label: "Acuity booking URL (Timetable + Get Started only)", hint: "Paste the iframe URL from Acuity → Embed code. Looks like https://app.acuityscheduling.com/schedule.php?owner=XXXXXXX", widget: string, required: false }
      - { name: youtubeVideoId, label: "YouTube video ID (Animal Flow only)", hint: "Paste only the 11-character ID from the URL — the bit after 'watch?v=' or in a youtu.be link. Leave blank to show the placeholder.", widget: string, required: false }
      - { name: body, label: "Body (optional, markdown)", widget: markdown, required: false }

  # ---------------------------------------------------------------
  # BLOG
  # ---------------------------------------------------------------
  - name: "blog"
    label: "Blog posts"
    label_singular: "Post"
    folder: "src/content/blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title}} · {{date | date('YYYY-MM-DD')}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: author, label: "Author", widget: string, default: "Nikki Rubino" }
      - { name: excerpt, label: "Excerpt (1-2 sentences)", widget: text, required: false }
      - { name: image, label: "Cover image", widget: image, required: false }
      - { name: tags, label: "Tags", widget: list, required: false }
      - { name: draft, label: "Draft (don't publish yet)", widget: boolean, default: false }
      - { name: body, label: "Body", widget: markdown }

  # ---------------------------------------------------------------
  # TESTIMONIALS
  # ---------------------------------------------------------------
  - name: "testimonials"
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: "src/content/testimonials"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "name"
    summary: "{{name}} — {{quote | truncate(60)}}"
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: role, label: "Role / context", widget: string, required: false }
      - name: program
        label: "Program"
        widget: select
        required: false
        options: ["1:1", "Semi-private", "Animal Flow", "Sassy Seniors", "Small group PT", "Workshop", "Other"]
      - { name: quote, label: "Quote", widget: text }
      - { name: avatar, label: "Avatar image", widget: image, required: false }
      - { name: featured, label: "Show on home page?", widget: boolean, default: false }
      - { name: order, label: "Display order", widget: number, default: 0, value_type: "int" }

  # ---------------------------------------------------------------
  # SESSIONS — class types / products
  # ---------------------------------------------------------------
  - name: "sessions"
    label: "Sessions (class types)"
    label_singular: "Session type"
    folder: "src/content/sessions"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: tag, label: "Chip label", widget: string, required: false }
      - name: tagStyle
        label: "Chip colour"
        widget: select
        options: ["teal", "pink", "orange"]
        default: "teal"
      - { name: summary, label: "Short summary", widget: text }
      - { name: capacity, label: "Capacity (e.g. 'Up to 8')", widget: string, required: false }
      - { name: duration, label: "Duration (e.g. '60 min')", widget: string, required: false }
      - { name: bestFor, label: "Best for", widget: string, required: false }
      - { name: image, label: "Image", widget: image, required: false }
      - { name: price, label: "Price line (e.g. '$55 · $150/wk')", widget: string, required: false }
      - { name: bookingUrl, label: "Booking link", widget: string, required: false }
      - { name: order, label: "Display order", widget: number, default: 0, value_type: "int" }
      - { name: showOnHome, label: "Show on home page?", widget: boolean, default: false }
      - { name: body, label: "Long description (markdown)", widget: markdown, required: false }

  # ---------------------------------------------------------------
  # FAQS
  # ---------------------------------------------------------------
  - name: "faqs"
    label: "FAQs"
    label_singular: "FAQ"
    folder: "src/content/faqs"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "question"
    summary: "{{category}} — {{question}}"
    fields:
      - { name: question, label: "Question", widget: string }
      - name: category
        label: "Category"
        widget: select
        options: ["Getting started", "Pricing", "Cancellations", "Sessions", "General"]
        default: "General"
      - { name: order, label: "Display order", widget: number, default: 0, value_type: "int" }
      - { name: body, label: "Answer", widget: markdown }

  # ---------------------------------------------------------------
  # SITE — reusable content blocks used across pages.
  # Filtered by Page (Home, Pricing, About, etc.) in the sidebar.
  # ---------------------------------------------------------------
  - name: "site"
    label: "Site blocks"
    label_singular: "Block"
    folder: "src/content/site"
    create: false
    delete: false
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{page}} · {{title}}"
    sortable_fields: ["page", "title"]
    view_groups:
      - { label: "By page", field: "page" }
    view_filters:
      - { label: "Home", field: "page", pattern: "^Home$" }
      - { label: "Sessions", field: "page", pattern: "^Sessions$" }
      - { label: "Sassy", field: "page", pattern: "^Sassy$" }
      - { label: "Animal Flow", field: "page", pattern: "^Animal Flow$" }
      - { label: "Pricing", field: "page", pattern: "^Pricing$" }
      - { label: "About", field: "page", pattern: "^About$" }
      - { label: "Contact", field: "page", pattern: "^Contact$" }
      - { label: "Footer", field: "page", pattern: "^Footer$" }
      - { label: "Shared across pages", field: "page", pattern: "^Shared$" }
    fields:
      - { name: title, label: "Block title (internal)", widget: string }
      - name: page
        label: "Which page does this block live on?"
        widget: select
        options: ["Home", "Sessions", "Sassy", "Animal Flow", "Timetable", "Pricing", "About", "Get Started", "Contact", "FAQ", "Speaking", "Footer", "Shared"]
        default: "Shared"
        hint: "Controls which group this block shows under in the sidebar."

      # General-purpose section fields. Each block uses whichever subset it needs.
      - { name: eyebrow, label: "Small label above the heading", widget: string, required: false }
      - { name: heading, label: "Heading", widget: string, required: false }
      - { name: subHeading, label: "Sub-heading (optional second heading)", widget: string, required: false }
      - { name: lead, label: "Lead paragraph (under the heading)", widget: text, required: false }
      - name: bullets
        label: "Bullet points"
        widget: list
        required: false
        field: { name: item, label: "Bullet", widget: string }
      - { name: closingLine, label: "Closing line (after the bullets)", widget: string, required: false }

      # CTAs and buttons
      - { name: ctaLabel, label: "Primary button label", widget: string, required: false }
      - { name: ctaHref, label: "Primary button link", widget: string, required: false }
      - { name: ctaSecondaryLabel, label: "Secondary button label", widget: string, required: false }
      - { name: ctaSecondaryHref, label: "Secondary button link", widget: string, required: false }
      - { name: ctaSubcopy, label: "CTA subcopy", widget: text, required: false }

      # Banner heading/subcopy
      - { name: bannerHeadline, label: "Banner headline (used inside callout boxes)", widget: string, required: false }
      - { name: bannerSubcopy, label: "Banner subcopy", widget: text, required: false }

      # Three doors / feature cards (Home etc.)
      - name: doors
        label: "Doors / feature cards"
        widget: list
        required: false
        fields:
          - { name: tag, label: "Chip label", widget: string }
          - name: tagStyle
            label: "Chip colour"
            widget: select
            options: ["teal", "pink", "orange"]
            default: "teal"
          - { name: heading, label: "Heading", widget: string }
          - { name: body, label: "Body", widget: text }
          - { name: href, label: "Link", widget: string }
          - { name: imageHint, label: "Photo caption", widget: string, required: false }
          - { name: arrowLabel, label: "Arrow label", widget: string, default: "Learn more →" }

      # Word tiles (Safe / Seen / Heard)
      - name: tiles
        label: "Word tiles (e.g. Safe / Seen / Heard)"
        widget: list
        required: false
        fields:
          - { name: word, label: "Word", widget: string }
          - { name: body, label: "Body", widget: text }

      # Pricing tier cards
      - name: tiers
        label: "Pricing tiers"
        widget: list
        required: false
        fields:
          - { name: label, label: "Tier label", widget: string }
          - { name: headline, label: "Optional headline (rarely used)", widget: string, required: false }
          - { name: amount, label: "Price (e.g. '$150')", widget: string }
          - { name: amountNote, label: "Price note (e.g. 'per session')", widget: string, required: false }
          - { name: desc, label: "Description", widget: text, required: false }
          - name: bullets
            label: "Bullet points"
            widget: list
            required: false
            field: { name: item, label: "Bullet", widget: string }
          - { name: ctaLabel, label: "Button label", widget: string, required: false }
          - { name: ctaHref, label: "Button link", widget: string, required: false }
          - { name: featured, label: "Featured (gets 'Best value' ribbon)", widget: boolean, default: false }

      # Policy blocks (heading + bullets)
      - name: policies
        label: "Policy blocks"
        widget: list
        required: false
        fields:
          - { name: heading, label: "Policy heading", widget: string }
          - name: bullets
            label: "Bullets"
            widget: list
            field: { name: item, label: "Bullet", widget: string }

      # Get Started "what to expect" cards
      - name: cards
        label: "Cards (icon / label / body)"
        widget: list
        required: false
        fields:
          - { name: icon, label: "Icon / emoji", widget: string }
          - { name: label, label: "Card label", widget: string }
          - { name: body, label: "Card body", widget: text }

      # Link lists (footer)
      - name: links
        label: "Links (flat list)"
        widget: list
        required: false
        fields:
          - { name: label, label: "Link label", widget: string }
          - { name: href, label: "Link URL", widget: string }
          - { name: external, label: "External link?", widget: boolean, default: false }
      - name: linkGroups
        label: "Link groups (e.g. footer columns)"
        widget: list
        required: false
        fields:
          - { name: heading, label: "Group heading", widget: string }
          - name: items
            label: "Items"
            widget: list
            fields:
              - { name: label, label: "Link label", widget: string }
              - { name: href, label: "Link URL", widget: string }
              - { name: external, label: "External?", widget: boolean, default: false }

      # Key/value rows (studio hours, etc.)
      - name: rows
        label: "Key/value rows (e.g. studio hours)"
        widget: list
        required: false
        fields:
          - { name: label, label: "Label", widget: string }
          - { name: value, label: "Value", widget: string }

      # Capacity grid (number + label cards)
      - name: capacityGrid
        label: "Capacity grid (number + label cards)"
        widget: list
        required: false
        fields:
          - { name: number, label: "Number (e.g. '6')", widget: string }
          - { name: label, label: "Label (e.g. 'Sassy Classics')", widget: string }
      - { name: capacityCaption, label: "Caption below the capacity grid", widget: text, required: false }

      # Footer-specific
      - { name: address, label: "Address (use \\n for new lines)", widget: text, required: false }
      - { name: phone, label: "Phone number", widget: string, required: false }
      - { name: email, label: "Email", widget: string, required: false }
      - { name: copyrightLine, label: "Copyright line ({year} is replaced automatically)", widget: string, required: false }
      - { name: creditLine, label: "Credit line", widget: string, required: false }

      # Sessions arc (used on multiple pages)
      - name: steps
        label: "Steps (Sessions arc)"
        widget: list
        required: false
        fields:
          - { name: title, label: "Step title", widget: string }
          - { name: body, label: "Step body", widget: text }
      - { name: introCtaHeadline, label: "Intro CTA headline (Sessions arc)", widget: string, required: false }
      - { name: introCtaSubcopy, label: "Intro CTA subcopy", widget: text, required: false }
      - { name: introCtaLabel, label: "Intro CTA button label", widget: string, required: false }
      - { name: introCtaHref, label: "Intro CTA button link", widget: string, required: false }

      # Intro band (yellow strip)
      - { name: bandText, label: "Yellow band paragraph (Intro band)", widget: text, required: false }
      - { name: bandTagText, label: "Yellow band tag text", widget: string, required: false }

      # FUEL band specific
      - { name: awardTagText, label: "Award tag text (FUEL band)", widget: string, required: false }
      - { name: pullQuote, label: "Pull quote (FUEL band)", widget: text, required: false }
      - { name: pullQuoteCite, label: "Pull quote citation", widget: string, required: false }

      - { name: body, label: "Body (markdown, FUEL band only)", widget: markdown, required: false }

  # ---------------------------------------------------------------
  # CREDENTIALS — qualification cards shown on /about
  # ---------------------------------------------------------------
  - name: "credentials"
    label: "Credentials"
    label_singular: "Credential"
    folder: "src/content/credentials"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{order}}. {{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { name: title, label: "Title", widget: string }
      - name: iconStyle
        label: "Icon style"
        widget: select
        options: ["featured", "standard"]
        default: "standard"
        hint: "Featured cards get a teal star icon, standard cards get a muted dot."
      - { name: linkLabel, label: "Optional link label (e.g. 'Read the speech')", widget: string, required: false }
      - { name: linkHref, label: "Optional link URL", widget: string, required: false }
      - { name: order, label: "Display order", widget: number, default: 99, value_type: "int" }
      - { name: draft, label: "Hide this credential", widget: boolean, default: false }
      - { name: body, label: "Body (the description text)", widget: markdown, required: false, hint: "The text under the title. Plain sentences are fine — bold, italics and links work too." }
