  # ===========================================================================
  # SHARED CONTENT — small singletons reused across multiple pages.
  # FUEL band (Sassy + About), Sessions arc (Sessions + About + Get Started),
  # Intro band (Sessions), Footer (everywhere).
  # ===========================================================================
  - name: "site"
    label: "Shared content"
    label_singular: "Shared block"
    delete: false

    files:

      - name: "fuel-band"
        label: "FUEL Woman of the Year band (Sassy + About)"
        file: "src/content/site/fuel-band.md"
        fields:
          - { name: title, label: "Block title (internal)", widget: string }
          - { name: awardTagText, label: "Award tag text (e.g. '★ Fuel Woman of the Year 2025')", widget: string, required: false }
          - { name: heading, label: "Heading", widget: string, required: false }
          - { name: pullQuote, label: "Pull quote", widget: text, required: false }
          - { name: pullQuoteCite, label: "Pull quote citation", widget: string, required: false }
          - { name: ctaLabel, label: "Button label", widget: string, required: false }
          - { name: ctaHref, label: "Button link", widget: string, required: false }
          - { name: body, label: "Body paragraph (markdown)", widget: markdown, required: false }

      - name: "sessions-arc"
        label: "Three-sessions arc (Sessions + About + Get Started)"
        file: "src/content/site/sessions-arc.md"
        fields:
          - { name: title, label: "Block title (internal)", widget: string }
          - { name: eyebrow, label: "Eyebrow", widget: string, required: false }
          - { name: heading, label: "Heading", widget: string, required: false }
          - { name: lead, label: "Lead", widget: text, required: false }
          - name: steps
            label: "Steps"
            widget: list
            fields:
              - { name: title, label: "Step title", widget: string }
              - { name: body, label: "Step body", widget: text }
          - { name: introCtaHeadline, label: "Intro CTA headline", widget: string, required: false }
          - { name: introCtaSubcopy, label: "Intro CTA subcopy", widget: text, required: false }
          - { name: introCtaLabel, label: "Intro CTA button label", widget: string, required: false }
          - { name: introCtaHref, label: "Intro CTA button link", widget: string, required: false }

      - name: "intro-band"
        label: "Yellow 'three session intro required' band (Sessions)"
        file: "src/content/site/intro-band.md"
        fields:
          - { name: title, label: "Block title (internal)", widget: string }
          - { name: bandTagText, label: "Yellow band tag text", widget: string, required: false }
          - { name: bandText, label: "Yellow band paragraph", widget: text, required: false }
          - { name: ctaLabel, label: "Inline link label", widget: string, required: false }
          - { name: ctaHref, label: "Inline link target", widget: string, required: false }

      - name: "footer"
        label: "Footer (every page)"
        file: "src/content/site/footer.md"
        fields:
          - { name: title, label: "Block title (internal)", widget: string }
          - { name: heading, label: "Brand heading (e.g. 'Coach Nikki')", widget: string, required: false }
          - { name: lead, label: "Tagline (small line under the brand)", widget: text, required: false }
          - { name: address, label: "Address line", widget: text, required: false }
          - { name: phone, label: "Phone", widget: string, required: false }
          - { name: email, label: "Email", widget: string, required: false }
          - name: linkGroups
            label: "Footer columns (link groups)"
            widget: list
            required: false
            fields:
              - { name: heading, label: "Column heading", widget: string }
              - name: items
                label: "Links"
                widget: list
                fields:
                  - { name: label, label: "Link label", widget: string }
                  - { name: href, label: "Link URL", widget: string }
                  - { name: external, label: "External?", widget: boolean, default: false }
          - { name: copyrightLine, label: "Copyright line ({year} is replaced automatically)", widget: string, required: false }
          - { name: creditLine, label: "Credit line (e.g. 'Site by Richie')", widget: string, required: false }

  # ===========================================================================
  # BLOG POSTS
  # ===========================================================================
  - name: "blog"
    label: "Blog posts"
    label_singular: "Post"
    folder: "src/content/blog"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    summary: "{{title}} · {{date | date('YYYY-MM-DD')}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { name: author, label: "Author", widget: string, default: "Nikki Rubino" }
      - { name: excerpt, label: "Excerpt (1-2 sentences)", widget: text, required: false }
      - { name: image, label: "Cover image", widget: image, required: false }
      - { name: tags, label: "Tags", widget: list, required: false }
      - { name: draft, label: "Draft (don't publish yet)", widget: boolean, default: false }
      - { name: body, label: "Body", widget: markdown }

  # ===========================================================================
  # TESTIMONIALS
  # ===========================================================================
  - name: "testimonials"
    label: "Testimonials"
    label_singular: "Testimonial"
    folder: "src/content/testimonials"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "name"
    summary: "{{name}} — {{quote | truncate(60)}}"
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: role, label: "Role / context", widget: string, required: false }
      - name: program
        label: "Program"
        widget: select
        required: false
        options: ["1:1", "Semi-private", "Animal Flow", "Sassy Seniors", "Semi-Private PT", "Workshop", "Other"]
      - { name: quote, label: "Quote", widget: text }
      - { name: avatar, label: "Avatar image", widget: image, required: false }
      - { name: featured, label: "Show on home page?", widget: boolean, default: false }
      - { name: order, label: "Display order", widget: number, default: 0, value_type: "int" }

  # ===========================================================================
  # SESSIONS — class types / products
  # ===========================================================================
  - name: "sessions"
    label: "Sessions (class types)"
    label_singular: "Session type"
    folder: "src/content/sessions"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: tag, label: "Chip label", widget: string, required: false }
      - name: tagStyle
        label: "Chip colour"
        widget: select
        options: ["teal", "pink", "orange"]
        default: "teal"
      - { name: summary, label: "Short summary", widget: text }
      - { name: capacity, label: "Capacity (e.g. 'Up to 8')", widget: string, required: false }
      - { name: duration, label: "Duration (e.g. '60 min')", widget: string, required: false }
      - { name: bestFor, label: "Best for", widget: string, required: false }
      - { name: image, label: "Image", widget: image, required: false }
      - { name: price, label: "Price line (e.g. '$55 · $150/wk')", widget: string, required: false }
      - { name: bookingUrl, label: "Booking link", widget: string, required: false }
      - { name: order, label: "Display order", widget: number, default: 0, value_type: "int" }
      - { name: showOnHome, label: "Show on home page?", widget: boolean, default: false }
      - { name: body, label: "Long description (markdown)", widget: markdown, required: false }

  # ===========================================================================
  # FAQS
  # ===========================================================================
  - name: "faqs"
    label: "FAQs"
    label_singular: "FAQ"
    folder: "src/content/faqs"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "question"
    summary: "{{category}} — {{question}}"
    fields:
      - { name: question, label: "Question", widget: string }
      - name: category
        label: "Category"
        widget: select
        options: ["Getting started", "Pricing", "Cancellations", "Sessions", "General"]
        default: "General"
      - { name: order, label: "Display order", widget: number, default: 0, value_type: "int" }
      - { name: body, label: "Answer", widget: markdown }

  # ===========================================================================
  # CREDENTIALS — qualification cards shown on /about
  # ===========================================================================
  - name: "credentials"
    label: "Credentials"
    label_singular: "Credential"
    folder: "src/content/credentials"
    create: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{order}}. {{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { name: title, label: "Title", widget: string }
      - name: iconStyle
        label: "Icon style"
        widget: select
        options: ["featured", "standard"]
        default: "standard"
        hint: "Featured cards get a teal star icon, standard cards get a muted dot."
      - { name: linkLabel, label: "Optional link label", widget: string, required: false }
      - { name: linkHref, label: "Optional link URL", widget: string, required: false }
      - { name: order, label: "Display order", widget: number, default: 99, value_type: "int" }
      - { name: draft, label: "Hide this credential", widget: boolean, default: false }
      - { name: body, label: "Body (the description text)", widget: markdown, required: false, hint: "Plain sentences are fine — bold, italics and links work too." }
