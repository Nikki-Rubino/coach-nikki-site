              - { name: ctaHref, label: "Primary button link", widget: string, required: false }
              - { name: ctaSecondaryLabel, label: "Secondary button label", widget: string, required: false }
              - { name: ctaSecondaryHref, label: "Secondary button link", widget: string, required: false }

          - { name: seoTitle, label: "SEO · Browser tab title", widget: string, required: false }
          - { name: seoDescription, label: "SEO · Description", widget: text, required: false }

